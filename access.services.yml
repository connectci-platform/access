services:
  logger.channel.access:
    parent: logger.channel_base
    arguments: ['access']

  # Makes symfony_mailer typed emails honor reroute_email's settings, which
  # only reroutes legacy mail via hook_mail_alter(). See hook_mailer_init().
  access.typed_email_rerouter:
    class: Drupal\access\Mail\TypedEmailRerouter
    arguments: ['@config.factory', '@module_handler', '@messenger', '@logger.channel.access']

  access.jwt_key_provider:
    class: Drupal\access\AccessJwtKeyProvider

  # Canonical ACCESS ID -> user resolution, shared by the MCP acting-user gate
  # and the JSON:API views-parameter subscriber so both resolve identity
  # identically.
  access.access_id_resolver:
    class: Drupal\access\AccessIdResolver
    arguments: ['@entity_type.manager', '@database']

  # Shared domain-gated hidden-option rules for access_events and access_news
  # forms/presave guards; see D8-2824 and Drupal\access\HiddenFieldOptions.
  access.hidden_field_options:
    class: Drupal\access\HiddenFieldOptions

  access.auth_cookie_subscriber:
    class: Drupal\access\EventSubscriber\AccessAuthCookieSubscriber
    arguments: ['@access.jwt_key_provider', '@current_user', '@entity_type.manager', '@state', '@logger.channel.default', '@database']
    tags:
      - { name: event_subscriber }

  access.jwks_controller:
    class: Drupal\access\Controller\JwksController
    arguments: ['@access.jwt_key_provider']

  # Access token endpoints: /api/agent-token (browser grant) and
  # /api/token-exchange (confidential clients). See ClientRegistry.
  access.token_client_registry:
    class: Drupal\access\TokenExchange\ClientRegistry
    arguments: ['@config.factory', '@access.jwt_key_provider', '@logger.channel.access']

  access.token_issuer:
    class: Drupal\access\TokenExchange\TokenIssuer
    arguments: ['@access.jwt_key_provider', '@datetime.time', '@logger.channel.access']

  access.agent_token_controller:
    class: Drupal\access\Controller\AgentTokenController
    arguments: ['@access.token_client_registry', '@access.token_issuer', '@current_user', '@access.access_id_resolver', '@flood', '@logger.channel.access', '@state', '@module_handler']

  access.token_exchange_controller:
    class: Drupal\access\Controller\TokenExchangeController
    arguments: ['@access.token_client_registry', '@access.token_issuer', '@access.jwt_key_provider', '@access.access_id_resolver', '@flood', '@logger.channel.access', '@datetime.time']

  access.token_endpoint_cors_subscriber:
    class: Drupal\access\EventSubscriber\TokenEndpointCorsSubscriber
    arguments: ['@access.agent_token_controller']
    tags:
      - { name: event_subscriber }

  # Per-request value object. Under PHP-FPM, Drupal's container is rebuilt
  # per request so the default singleton scope is effectively per-request.
  # If this site ever moves to a persistent worker runtime (FrankenPHP,
  # RoadRunner, Octane-style), revisit this: shared: false with a factory
  # would be needed, or the state should live on $request->attributes.
  access.eligibility_state:
    class: Drupal\access\EligibilityState

  access.eligibility_check_subscriber:
    class: Drupal\access\EventSubscriber\EligibilityCheckSubscriber
    arguments:
      - '@current_user'
      - '@entity_type.manager'
      - '@access_affinitygroup.allocations_client'
      - '@access.eligibility_state'
    tags:
      - { name: event_subscriber }
