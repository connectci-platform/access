services:
  access_content_api.eligibility:
    class: Drupal\access_content_api\ContentEligibility
    arguments:
      - '@config.factory'
      - '@entity_type.manager'
      - '@entity_display.repository'
      - '@logger.channel.access_content_api'

  access_content_api.text_extractor:
    class: Drupal\access_content_api\TextExtractor

  access_content_api.layout_walker:
    class: Drupal\access_content_api\LayoutWalker
    arguments:
      - '@plugin.manager.block'
      - '@renderer'
      - '@logger.channel.access_content_api'
      - '@access_content_api.eligibility'

  access_content_api.render_hash:
    class: Drupal\access_content_api\RenderHash
    arguments:
      - '@access_content_api.layout_walker'
      - '@access_content_api.text_extractor'
      - '@renderer'
      - '@account_switcher'

  logger.channel.access_content_api:
    parent: logger.channel_base
    arguments: ['access_content_api']
