services:
  access_content_api.text_extractor:
    class: Drupal\access_content_api\TextExtractor

  access_content_api.layout_walker:
    class: Drupal\access_content_api\LayoutWalker
    arguments:
      - '@entity_type.manager'
      - '@entity_display.repository'
      - '@plugin.manager.block'
      - '@renderer'
      - '@current_user'
      - '@logger.channel.access_content_api'

  logger.channel.access_content_api:
    parent: logger.channel_base
    arguments: ['access_content_api']
