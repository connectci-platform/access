access_affinitygroup.constantcontact_form:
  path: '/admin/services/constantcontact-token'
  defaults:
    _form: '\Drupal\access_affinitygroup\Form\ConstantContact'
    _title: 'Constant Contact Tools'
  requirements:
    _role: 'administrator'
access_affinitygroup.simplelist:
  path: '/simplelist/{sl_action}'
  defaults:
    _controller: '\Drupal\access_affinitygroup\Controller\SimpleListController::simplelist'
    _title: ''
  requirements:
    _role: 'authenticated'
  options:
    no_cache: 'TRUE'

access_affinitygroup.rp_account:
  path: '/api/1.0/rp-account/{rp_nid}'
  defaults:
    _controller: '\Drupal\access_affinitygroup\Controller\RpAccountController::get'
  requirements:
    rp_nid: '\d+'
    _user_is_logged_in: 'TRUE'
    _custom_access: 'access_affinitygroup.acting_user_access:check'
  options:
    no_cache: TRUE

access_affinitygroup.rp_account_by_resource:
  path: '/api/1.0/rp-account/by-resource/{global_resource_id}'
  defaults:
    _controller: '\Drupal\access_affinitygroup\Controller\RpAccountController::getByResourceId'
  requirements:
    _user_is_logged_in: 'TRUE'
    _custom_access: 'access_affinitygroup.acting_user_access:check'
  options:
    no_cache: TRUE

access_affinitygroup.rp_accounts_list:
  path: '/api/1.0/rp-accounts'
  defaults:
    _controller: '\Drupal\access_affinitygroup\Controller\RpAccountController::listAccounts'
  requirements:
    _user_is_logged_in: 'TRUE'
    _custom_access: 'access_affinitygroup.acting_user_access:check'
  options:
    no_cache: TRUE

access_affinitygroup.announcement_create:
  path: '/api/2.3/announcements'
  methods: [POST]
  defaults:
    _controller: '\Drupal\access_affinitygroup\Controller\AnnouncementApiController::createAnnouncement'
  requirements:
    _user_is_logged_in: 'TRUE'
    _custom_access: 'access_affinitygroup.acting_user_access:check'
    _csrf_request_header_token: 'TRUE'
  options:
    no_cache: TRUE

access_affinitygroup.announcement_mine:
  path: '/api/2.3/announcements/mine'
  methods: [GET]
  defaults:
    _controller: '\Drupal\access_affinitygroup\Controller\AnnouncementApiController::mine'
  requirements:
    _user_is_logged_in: 'TRUE'
    _custom_access: 'access_affinitygroup.acting_user_access:check'
  options:
    no_cache: TRUE

access_affinitygroup.announcement_update:
  path: '/api/2.3/announcements/{uuid}'
  methods: [PATCH]
  defaults:
    _controller: '\Drupal\access_affinitygroup\Controller\AnnouncementApiController::update'
  requirements:
    _user_is_logged_in: 'TRUE'
    _custom_access: 'access_affinitygroup.acting_user_access:check'
    _csrf_request_header_token: 'TRUE'
  options:
    no_cache: TRUE

access_affinitygroup.announcement_delete:
  path: '/api/2.3/announcements/{uuid}'
  methods: [DELETE]
  defaults:
    _controller: '\Drupal\access_affinitygroup\Controller\AnnouncementApiController::delete'
  requirements:
    _user_is_logged_in: 'TRUE'
    _custom_access: 'access_affinitygroup.acting_user_access:check'
    _csrf_request_header_token: 'TRUE'
  options:
    no_cache: TRUE

