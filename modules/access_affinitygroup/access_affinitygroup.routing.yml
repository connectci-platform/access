access_affinitygroup.constantcontact_form:
  path: '/admin/services/constantcontact-token'
  defaults:
    _form: '\Drupal\access_affinitygroup\Form\ConstantContact'
    _title: 'Constant Contact Tools'
  requirements:
    _role: 'administrator'
access_affinitygroup.simplelist:
  path: '/simplelist/{sl_action}'
  defaults:
    _controller: '\Drupal\access_affinitygroup\Controller\SimpleListController::simplelist'
    _title: ''
  requirements:
    _role: 'authenticated'
  options:
    no_cache: 'TRUE'

access_affinitygroup.rp_account:
  path: '/api/1.0/rp-account/{rp_nid}'
  defaults:
    _controller: '\Drupal\access_affinitygroup\Controller\RpAccountController::get'
  requirements:
    rp_nid: '\d+'
    _user_is_logged_in: 'TRUE'
    _custom_access: 'access_affinitygroup.rp_account_access:check'
  options:
    no_cache: TRUE

access_affinitygroup.rp_account_by_resource:
  path: '/api/1.0/rp-account/by-resource/{global_resource_id}'
  defaults:
    _controller: '\Drupal\access_affinitygroup\Controller\RpAccountController::getByResourceId'
  requirements:
    _user_is_logged_in: 'TRUE'
    _custom_access: 'access_affinitygroup.rp_account_access:check'
  options:
    no_cache: TRUE

access_affinitygroup.rp_accounts_list:
  path: '/api/1.0/rp-accounts'
  defaults:
    _controller: '\Drupal\access_affinitygroup\Controller\RpAccountController::listAccounts'
  requirements:
    _user_is_logged_in: 'TRUE'
    _custom_access: 'access_affinitygroup.rp_account_access:check'
  options:
    no_cache: TRUE

