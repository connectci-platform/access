services:
  access_affinitygroup.cache_clear_subscriber:
    class: Drupal\access_affinitygroup\EventSubscriber\AffinityGroupCacheClearSubscriber
    tags:
      - { name: event_subscriber }
  access_affinitygroup.xdusage_client:
    class: Drupal\access_affinitygroup\Service\XdusageClient
    arguments:
      - '@http_client'
      - '@key.repository'
      - '@cache.default'
      - '@logger.factory'
  access_affinitygroup.allocations_client:
    class: Drupal\access_affinitygroup\Service\AllocationsClient
    arguments:
      - '@http_client'
      - '@file_system'
      - '@logger.factory'
  access_affinitygroup.rp_account:
    class: Drupal\access_affinitygroup\Service\RpAccountService
    arguments:
      - '@database'
      - '@entity_type.manager'
      - '@access_affinitygroup.allocations_client'
      - '@access_affinitygroup.xdusage_client'
      - '@cache.default'
      - '@logger.factory'
      - '@datetime.time'
