services:
  access_misc.subscriber:
    class: '\Drupal\access_misc\EventSubscriber\Subscriber'
    tags:
      - { name: "event_subscriber" }
  access_misc.addtags:
    class: Drupal\access_misc\Plugin\NodeAddTags
    arguments: ["@renderer"]

  access_misc.skillLevel:
    class: Drupal\access_misc\Plugin\SkillLevel

  access_misc.import_access_orgs:
    class: Drupal\access_misc\Services\ImportAccessOrgs
    arguments: ["%access_misc.verbose%"]

  access_misc.allocations_user_creator:
    class: Drupal\access_misc\Services\AllocationsUserCreator
    arguments: ["@http_client", "@entity_type.manager", "@file_system", "@logger.factory"]

  access_misc.symfony.mail:
    class: Drupal\access_misc\Services\SymfonyMail

  access_misc.sitetools:
    class: Drupal\access_misc\Plugin\Util\SiteTools
    arguments: ["@entity_type.manager", "@token"]

  access_misc.usertools:
    class: Drupal\access_misc\Plugin\Util\UserTools
    arguments: ["@entity_type.manager"]

  access_misc.project_flag_subscriber:
    class: Drupal\access_misc\EventSubscriber\ProjectFlagSubscriber
    arguments:
      - "@entity_type.manager"
      - "@request_stack"
      - "@access_misc.sitetools"
      - "@access_misc.usertools"
      - "@access_misc.symfony.mail"
    tags:
      - { name: event_subscriber }

  access_misc.jsonapi_email_to_uuid_subscriber:
    class: Drupal\access_misc\EventSubscriber\JsonApiEmailToUuidSubscriber
    arguments:
      - "@entity_type.manager"
    tags:
      - { name: event_subscriber }

  access_misc.jsonapi_views_user_parameter_subscriber:
    class: Drupal\access_misc\EventSubscriber\JsonApiViewsUserParameterSubscriber
    arguments:
      - "@entity_type.manager"
    tags:
      - { name: event_subscriber }

  access_misc.viewstools:
    class: Drupal\access_misc\Plugin\Util\ViewsTools
    arguments: ["@entity_type.manager"]

parameters:
  access_misc.verbose: FALSE
