filter_people_by_tags_form.form:
  path: 'admin/people/filter-by-tags'
  defaults:
    _form: '\Drupal\access_misc\Form\FilterPeopleByTags'
    _title: 'Filter users by flagged interest or skill'
  requirements:
    _role: 'administrator+match_sc+match_pm'
misc.login:
  path: '/login'
  defaults:
    _controller: '\Drupal\access_misc\Controller\LoginController::login'
    _title: ''
  requirements:
    _permission: 'access content'
  options:
    no_cache: 'TRUE'
wvuf_api_integration.unmask:
  path: 'unmask'
  defaults:
    _controller: '\Drupal\masquerade\Controller\SwitchController::switchBack'
    _title: 'Unmask'
  requirements:
    _user_is_masquerading: 'TRUE'
access_misc.turnstile_challenge:
  path: '/turnstile-challenge'
  defaults:
    _controller: '\Drupal\access_misc\Controller\TurnstileController::challenge'
    _title: 'Verify You''re Human'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: 'TRUE'
access_misc.turnstile_verify:
  path: '/turnstile-verify'
  defaults:
    _controller: '\Drupal\access_misc\Controller\TurnstileController::verify'
    _title: ''
  requirements:
    _access: 'TRUE'
  options:
    no_cache: 'TRUE'
