access_misc.domain_logos:
  type: config_object
  label: 'Domain Logos and Descriptions Configuration'
  mapping:
    logos:
      type: sequence
      label: 'Domain Logo URLs'
      sequence:
        type: string
        label: 'Logo URL'
    share_images:
      type: sequence
      label: 'Domain Share Image URLs'
      sequence:
        type: string
        label: 'Share image URL'
    descriptions:
      type: sequence
      label: 'Domain Descriptions'
      sequence:
        type: string
        label: 'Description'

block.settings.access_homepage_hero:
  type: block_settings
  label: 'Homepage hero block settings'
  mapping:
    assistant_url:
      type: uri
      label: 'Assistant URL'
