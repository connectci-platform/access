services:
  access_events.XsedeApi:
    class: Drupal\access_events\Plugin\XsedeApi
    arguments: ['@entity_type.manager', '@key.repository', '@http_client', '@logger.channel.default', '@messenger', '@string_translation']
  access_events.latest_revision:
    class: Drupal\access_events\Plugin\LatestRevisionCheck
    decorates: access_check.latest_revision
    arguments: ['@content_moderation.moderation_information']
    tags:
      - { name: access_check, applies_to: _content_moderation_latest_version }

