services:
  access_events.domain_context:
    class: Drupal\access_events\EventDomainContext
    arguments: ['@router.request_context', '@?domain.negotiator']
  access_events.event_access:
    class: Drupal\access_events\Service\EventAccessService
  access_events.XsedeApi:
    class: Drupal\access_events\Plugin\XsedeApi
    arguments:
      [
        "@entity_type.manager",
        "@key.repository",
        "@http_client",
        "@logger.channel.default",
        "@messenger",
        "@string_translation",
      ]
  access_events.post_survey:
    class: Drupal\access_events\Plugin\PostSurvey
    arguments:
      [
        "@entity_type.manager",
        "@datetime.time",
        "@request_stack",
        "@access_misc.sitetools",
        "@access_misc.symfony.mail",
        "@logger.factory",
        "@access_events.domain_context",
      ]
  access_events.latest_revision:
    class: Drupal\access_events\Plugin\LatestRevisionCheck
    decorates: access_check.latest_revision
    arguments: ['@content_moderation.moderation_information']
    tags:
      - { name: access_check, applies_to: _content_moderation_latest_version }
  access_events.access_helper:
    class: Drupal\access_events\EventAccessHelper
    arguments: ['@access_affinitygroup.coordinator_access', '@current_user']
  access_events.registrant_counter:
    class: Drupal\access_events\RegistrantCounter
    arguments: ['@entity_type.manager']
  access_events.event_delete_guard:
    class: Drupal\access_events\EventDeleteGuard
    arguments: ['@access_events.registrant_counter']
  access_events.cancellation_notifier:
    class: Drupal\access_events\CancellationNotifier
    arguments: ['@entity_type.manager', '@recurring_events_registration.notification_service', '@datetime.time', '@config.factory', '@database', '@access_events.domain_context']
  access_events.state_change_collector:
    class: Drupal\access_events\StateChangeCollector
  access_events.state_reactions:
    class: Drupal\access_events\EventStateReactions
    arguments:
      [
        "@entity_type.manager",
        "@access_events.registrant_counter",
        "@access_events.cancellation_notifier",
        "@access_events.state_change_collector",
        "@datetime.time",
      ]
  access_events.effective_creation_set:
    class: Drupal\access_events\EffectiveCreationSet
    arguments:
      [
        "@recurring_events.event_creation_service",
        "@plugin.manager.field.field_type",
        "@module_handler",
        "@messenger",
        "@datetime.time",
      ]
  access_events.form_warnings:
    class: Drupal\access_events\FormWarnings
    arguments:
      [
        "@access_events.registrant_counter",
        "@access_events.effective_creation_set",
        "@config.factory",
        "@entity_type.manager",
        "@string_translation",
      ]
