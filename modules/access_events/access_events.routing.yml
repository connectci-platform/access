access_events.registrations_list:
  path: '/api/1.0/registrations'
  defaults:
    _controller: '\Drupal\access_events\Controller\RegistrationApiController::list'
  methods: [GET]
  requirements:
    _user_is_logged_in: 'TRUE'
    _custom_access: 'access_affinitygroup.acting_user_access:check'
  options:
    no_cache: 'TRUE'

access_events.registrations_cancel:
  path: '/api/1.0/registrations/{registrant_id}'
  defaults:
    _controller: '\Drupal\access_events\Controller\RegistrationApiController::cancel'
  methods: [DELETE]
  requirements:
    _user_is_logged_in: 'TRUE'
    _custom_access: 'access_affinitygroup.acting_user_access:check'
    # State-changing route: require a valid X-CSRF-Token header (from
    # /session/token). Custom routes do not get REST's automatic CSRF check,
    # so without this a plain cookie-authenticated DELETE is CSRF-able.
    _csrf_request_header_token: 'TRUE'
  options:
    no_cache: 'TRUE'

access_events.event_detail:
  path: '/api/1.0/events/{eventinstance}'
  defaults:
    _controller: '\Drupal\access_events\Controller\EventDetailApiController::get'
  methods: [GET]
  requirements:
    eventinstance: '\d+'
    _user_is_logged_in: 'TRUE'
    _custom_access: 'access_affinitygroup.rp_account_access:check'
  options:
    parameters:
      eventinstance:
        type: 'entity:eventinstance'
    no_cache: 'TRUE'

event.eventApprove:
  path: '/events/{event_id}/waitlist/approve'
  defaults:
    _controller: '\Drupal\access_events\Controller\EventWaitlist::approve'
    _title: 'Approved'
  requirements:
    _custom_access:  '\Drupal\access_events\Controller\EventWaitlist::isAuthor'
  options:
    no_cache: 'TRUE'
event.eventDeny:
  path: '/events/{event_id}/waitlist/unapprove'
  defaults:
    _controller: '\Drupal\access_events\Controller\EventWaitlist::unapprove'
    _title: 'Unapproved'
  requirements:
    _custom_access:  '\Drupal\access_events\Controller\EventWaitlist::isAuthor'
  options:
    no_cache: 'TRUE'
event.postsurvey:
  path: '/events/{entity}/post_survey/{user}'
  defaults:
    _controller: '\Drupal\access_events\Controller\EventPostSurvey::clicked'
    _title: 'Survey Clicked'
  requirements:
    _permission: 'access content'
  options:
    no_cache: 'TRUE'
