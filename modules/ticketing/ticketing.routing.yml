ticketing.content:
  path: '/open-a-ticket'
  defaults:
    _controller: '\Drupal\ticketing\Controller\TicketingController::doRedirect'
    _title: 'Ticket redirect'
    ticket_id: NULL
  requirements:
    _permission: 'access content'
  options:
    no_cache: 'TRUE'

ticketing.content.with_id:
  path: '/open-a-ticket/{ticket_id}'
  defaults:
    _controller: '\Drupal\ticketing\Controller\TicketingController::doRedirect'
    _title: 'Ticket redirect'
  requirements:
    _permission: 'access content'
    ticket_id: \d+
options:
    no_cache: 'TRUE'
