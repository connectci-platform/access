openapi: 3.0.3
info:
  title: ACCESS Events Write API (v2.3, authenticated)
  description: |
    The ACCESS Events Write API v2.3 provides authenticated, acting-user endpoints to create, update, archive, restore, and schedule events.

    Unlike the public read-only events listings and detail (the Events READ API v2.3), these are
    custom-controller endpoints that accept and return plain JSON bodies. They let an authenticated
    acting user create a draft event series, edit its content, send it for review, archive and
    restore it, and add, edit, cancel, and restore individual occurrences.

    ## Endpoints
    - **Event series**: Create a draft series (`POST /events`), edit its content
      (`PATCH /event-series/{eventseries}`), archive or delete it
      (`DELETE /event-series/{eventseries}`), restore an archived series
      (`POST /event-series/{eventseries}/restore`), and route a draft for editor review
      (`POST /event-series/{eventseries}/send-for-review`).
    - **Event occurrences**: Add one occurrence to a series
      (`POST /event-series/{eventseries}/occurrence`), edit one occurrence's date or location
      (`PATCH /event-occurrences/{eventinstance}`), cancel one occurrence
      (`DELETE /event-occurrences/{eventinstance}`), and restore a cancelled occurrence
      (`POST /event-occurrences/{eventinstance}/restore`).

    ## Authentication
    These endpoints require acting-user authentication. Requests are made by a service account
    (authenticated as `mcp_service`) that passes an `X-Acting-User` header naming the ACCESS user
    on whose behalf the operation is performed. Every endpoint runs **as** that acting user, so
    entity access and editorial workflow transitions are enforced against that user's own
    permissions. Requests with no valid acting user are rejected with `403`.

    **All** of these endpoints are state-changing and require a valid `X-CSRF-Token` header
    obtained from `/session/token`.

    ## Preview then confirm
    Several operations take a `confirmed` query parameter (boolean). When `confirmed` is absent or
    false the call is a **no-write preview** that returns `{status: "preview", executed: false, ...}`
    describing what would happen; call again with `confirmed=true` to perform the write.

    - `POST /events`: without `confirmed=true`, the preview computes the occurrence dates the
      recurrence would produce (`occurrence_count`, `total_occurrence_count`, `truncated`,
      `occurrences`). Nothing is saved.
    - `DELETE /event-series/{eventseries}`: the preview reports `would_archive`,
      `would_hard_delete`, and `registrants_affected` (plus `refusal` and `registrations_total` when
      the delete would be refused).
    - `DELETE /event-occurrences/{eventinstance}`: the preview reports `registrants_affected`.
    - `PATCH /event-occurrences/{eventinstance}`: a preview is returned only when the edit changes
      the date to a future date and the occurrence has registrants; any other edit proceeds
      without confirmation.

    The other operations (`PATCH /event-series/{eventseries}`, restore, send-for-review, add
    occurrence, restore occurrence) do not read `confirmed` and always execute.

    ## Moderation states
    - **Create** always produces a `draft`. Any caller-supplied `moderation_state` is ignored, and
      there is no self-publish path. The create response carries a `moderation` block (`state`,
      `can_publish`, `next_action`, `message`) derived from the acting user's valid workflow
      transitions on the new series: `can_publish` is true when the user holds the `publish`
      transition. When the user cannot publish but can send for review, `next_action` is
      `send_for_review` and `message` explains that an editor must approve and publish the draft.
    - **Send for review** (`POST .../send-for-review`) is valid only from `draft` or
      `needs_adjustment`, and moves the series to `ready_for_review`.
    - **Update** (`PATCH /event-series/{eventseries}`) writes content fields and `title` only. It
      never writes `moderation_state` (any supplied value is ignored) and never changes recurrence
      configuration. Editing a published series requires the user to hold the publish transition;
      otherwise the call is refused with `invalid_state`. A series in a state with no same-state
      edit transition (for example `needs_adjustment` or `archived`) is also refused with
      `invalid_state`.
    - **Delete** (`DELETE /event-series/{eventseries}`) behaves by history. A series that was ever
      published is **archived** (`moderation_state` becomes `archived`); registrations are kept. The
      series save triggers a state-change sweep that also archives its published, not-yet-ended
      occurrences and queues cancellation notices to their registrants. A series that was never
      published (a draft) is **hard-deleted** instead, but only if it has no registrations at all;
      otherwise the call is refused with `registrations_exist`. Deleting an already archived series
      is an idempotent success. Only a published series can be archived; other states are refused
      with `forbidden`.
    - **Restore** (`POST .../restore`) works only from `archived` and moves the series to
      `published` (the `archived_published` transition, which ordinary authors and affinity group
      leaders typically do not hold). Its state-change sweep republishes the series' archived
      occurrences that were not individually cancelled and queues reinstatement notices. Restoring
      an already published series is an idempotent success; any other state is refused with
      `invalid_state`.
    - **Occurrence cancel** (`DELETE /event-occurrences/{eventinstance}`): a `published` occurrence
      is archived and its registrants are notified; an already `archived` occurrence is marked
      individually cancelled so a later series restore skips it; a `draft` or any other state is
      refused with `invalid_state`.
    - **Occurrence restore** (`POST /event-occurrences/{eventinstance}/restore`): only an
      `archived` occurrence can be restored. If the parent series is published, the occurrence is
      republished. If the parent series is not published, the occurrence stays archived but its
      individually-cancelled flag is cleared and the response carries `returns_with_series: true`,
      so it returns when the series is restored.
    - **Add occurrence** is refused with `invalid_state` for a draft series. For an archived
      series the new occurrence is born archived and returns when the series is restored.

    ## Timezone and in-person
    `field_event_timezone` and `field_event_in_person` are writable on both create and update. If
    `field_event_timezone` is omitted, null, or an empty string, it is filled from the acting
    user's account timezone. A supplied value that is not a valid IANA timezone name (for example
    `America/Chicago`) is refused with `422` `validation_error`.

    ## Errors
    Refusals use the envelope `{error, message}`. The `error` codes and their HTTP statuses are:

    | error | HTTP | Meaning |
    |---|---|---|
    | `forbidden` | 403 | No acting user, entity create access denied, or a required editorial transition or permission is not held (archive, restore, send for review, occurrence cancel and restore) |
    | `not_found` | 404 | The event series or occurrence does not exist |
    | `not_coordinator` | 409 | The acting user may not manage the series (or, on create, is not a coordinator of every supplied affinity group) |
    | `invalid_state` | 409 | The current moderation state does not allow the operation |
    | `registrations_exist` | 409 | A never-published draft with registrations cannot be hard-deleted |
    | `duplicate_date` | 409 | An occurrence already exists at the requested start time |
    | `validation_error` | 422 | A required value is missing, a value is invalid, or entity validation failed |
